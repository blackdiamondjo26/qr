    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [], animationId;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() { this.reset(true); }

            reset(init = false) {
                this.x = Math.random() * canvas.width;
                this.y = init ? Math.random() * canvas.height : canvas.height + 20;
                this.size = Math.random() * 7 + 3;
                this.maxOpacity = Math.random() * 0.18 + 0.04;
                this.opacity = this.maxOpacity;
                this.speedX = (Math.random() - 0.5) * 0.25;
                this.speedY = -Math.random() * 0.35 - 0.08;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.008;
                this.isCrimson = Math.random() < 0.18;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
                this.opacity -= 0.00025;
                if (this.y < -20 || this.opacity <= 0) this.reset();
            }

            draw() {
                const w = this.size, h = this.size * 1.2;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.moveTo(0, -h / 2);
                ctx.lineTo(w / 2, -h * 0.1);
                ctx.lineTo(w / 2, h * 0.15);
                ctx.lineTo(0, h / 2);
                ctx.lineTo(-w / 2, h * 0.15);
                ctx.lineTo(-w / 2, -h * 0.1);
                ctx.closePath();
                ctx.strokeStyle = this.isCrimson ? 'rgba(187,43,35,0.7)' : 'rgba(255,255,255,0.45)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(Math.floor(window.innerWidth / 45), 18);
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            animationId = requestAnimationFrame(animate);
        }

        resize(); initParticles(); animate();

        window.addEventListener('resize', () => {
            cancelAnimationFrame(animationId);
            resize(); initParticles(); animate();
        });
    </script>
